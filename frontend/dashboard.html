<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | SkillSwap</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>My Dashboard</h1>
      <nav>
        <a href="/index.html">Home</a>
        <button id="logoutBtn" class="link-btn">Logout</button>
      </nav>
    </header>

    <main class="container">
      <h2>Add / Edit Skill</h2>
      <form id="skillForm" class="form-card">
        <input type="hidden" id="skillId" />

        <label>Title</label>
        <input type="text" id="title" required />

        <label>Description</label>
        <textarea id="description" rows="4" required></textarea>

        <label>Price (USD)</label>
        <input type="number" id="price" min="0" step="0.01" required />

        <button type="submit">Save Skill</button>
      </form>

      <p id="message" class="status"></p>

      <h2>My Skills</h2>
      <section id="mySkills" class="card-grid"></section>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/dashboard.js"></script>
  </body>
</html>
